path = "../../tests/verify_pipeline.rs"

[[test]]
name = "forensic_tests"
path = "../../tests/forensic_tests.rs"

[[test]]
name = "tool_tests"
path = "../../tests/tool_tests.rs"

[[test]]
name = "minutiae_tests"
path = "../../tests/minutiae_tests.rs"

