name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            package_deb: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            package_deb: false
          - os: macos-15
            target: aarch64-apple-darwin
            use_cross: false
            package_deb: false
          - os: macos-15-intel
            target: x86_64-apple-darwin
            use_cross: false
            package_deb: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux x86_64 dependencies
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libusb-1.0-0-dev pkg-config
          cargo install cargo-deb --locked

      - name: Install cross for Linux ARM64
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install libusb

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build with Cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --locked --release --package fs80h-cli --target ${{ matrix.target }}

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --locked --release --package fs80h-cli --target ${{ matrix.target }}

      - name: Build Debian package
        if: matrix.package_deb
        run: |
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/fs80hctl target/release/fs80hctl
          cargo deb --locked --no-build --package fs80h-cli

      - name: Package release assets and checksums
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
          PACKAGE_DEB: ${{ matrix.package_deb }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          archive="fs80hctl-v${version}-${TARGET}.tar.gz"
          stage="$(mktemp -d)"
          mkdir -p dist

          install -m 0755 "target/${TARGET}/release/fs80hctl" "${stage}/fs80hctl"
          cp -R man "${stage}/man"
          cp LICENSE "${stage}/LICENSE"

          if [[ "${TARGET}" == *-unknown-linux-* ]]; then
            cp -R udev systemd "${stage}/"
          fi

          tar -czf "dist/${archive}" -C "${stage}" .
          (
            cd dist
            if command -v sha256sum >/dev/null; then
              sha256sum "${archive}" > "${archive}.sha256"
            else
              shasum -a 256 "${archive}" > "${archive}.sha256"
            fi
          )

          if [[ "${PACKAGE_DEB}" == "true" ]]; then
            deb="$(find target/debian -maxdepth 1 -type f -name '*.deb' -print -quit)"
            test -n "${deb}"
            deb_name="fs80hctl-v${version}-${TARGET}.deb"
            cp "${deb}" "dist/${deb_name}"
            (
              cd dist
              if command -v sha256sum >/dev/null; then
                sha256sum "${deb_name}" > "${deb_name}.sha256"
              else
                shasum -a 256 "${deb_name}" > "${deb_name}.sha256"
              fi
            )
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-and-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: [build-and-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download macOS release checksums
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Update the Homebrew formula
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HOMEBREW_TAP_TOKEN}"

          version="${TAG#v}"
          arm_archive="fs80hctl-v${version}-aarch64-apple-darwin.tar.gz"
          intel_archive="fs80hctl-v${version}-x86_64-apple-darwin.tar.gz"
          arm_sha="$(awk '{print $1}' "release-assets/${arm_archive}.sha256")"
          intel_sha="$(awk '{print $1}' "release-assets/${intel_archive}.sha256")"
          test "${#arm_sha}" -eq 64
          test "${#intel_sha}" -eq 64

          git clone --depth=1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/faeliaso/homebrew-tap.git" tap
          cd tap

          VERSION="${version}" ARM_SHA="${arm_sha}" INTEL_SHA="${intel_sha}" ruby <<'RUBY'
          formula = "Formula/fs80hctl.rb"
          contents = File.read(formula)
          version = ENV.fetch("VERSION")

          raise "formula version not found" unless contents.sub!(/version "[^"]+"/, %(version "#{version}"))

          replacements = {
            /((?:url ".*aarch64-apple-darwin\.tar\.gz"\n)(?:\s*#.*\n)?\s*sha256 ")[0-9a-f]{64}(")/ => ENV.fetch("ARM_SHA"),
            /((?:url ".*x86_64-apple-darwin\.tar\.gz"\n)(?:\s*#.*\n)?\s*sha256 ")[0-9a-f]{64}(")/ => ENV.fetch("INTEL_SHA"),
          }

          replacements.each do |pattern, checksum|
            updated = contents.sub!(pattern) { "#{$1}#{checksum}#{$2}" }
            raise "formula checksum pattern not found" unless updated
          end

          File.write(formula, contents)
          RUBY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/fs80hctl.rb
          git diff --cached --quiet || git commit -m "chore: bump fs80hctl to ${TAG}"
          git push origin HEAD:main
