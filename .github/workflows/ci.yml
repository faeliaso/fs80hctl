name: CI

on:
  # Validate every change merged into the supported integration branches.
  push:
    branches: [main, master]
  # Protect the same branches before changes are merged.
  pull_request:
    branches: [main, master]

# Read-only access is sufficient for checkout and dependency caching.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Native dependencies required by the USB driver on Linux.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libusb-1.0-0-dev pkg-config

      # Keep macOS builds linked against the Homebrew-provided libusb.
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install libusb

      # Pin the CI interface to stable Rust and install the tools used below.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Scope the cache to this workspace and OS to prevent cross-platform reuse.
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-workspace
          workspaces: . -> target

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check

      - name: Run Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Check workspace targets and examples
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets

      - name: Run workspace tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets --verbose
