[workspace]
members = [
  "crates/fs80h-core",
  "crates/fs80h-driver",
  "crates/fs80h-cli",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
openjpeg2-pure-rs = "0.1.1"
png = "0.17"
proptest = "1.5"
rayon = "1.10"
futronic-fs80h-rs = "0.1.1"
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rustfft = "6.2"
blake3 = "1.5"
tempfile = "3.17"
thiserror = "2.0"
tiff = "0.9.1"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wsq-codec = "0.2.0"

